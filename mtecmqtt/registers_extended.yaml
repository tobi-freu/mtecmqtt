---
# Extended Read-Only Register Catalog for M-TEC Energy Butler (Wattsonic / Solinteg Gen3)
# Verified against M-TEC Energy Butler 20kW-3P-3G40 (FW V1.0.0.1-27.53.5.0, Slave 252, FC 0x03)
#
# Invariants:
# - Strictly Read-Only (writable: false).
# - All new / enriched entities are registered in HA under entity_category: diagnostic
#   and enabled by default (no enabled_by_default: false).
# - Never alter unique_id, state_topic, name, or formatting of the 81 existing HA entities.

# ----------------------------------------------------------------------------
# 1. Enrichments for existing upstream registers that lacked HA discovery
# ----------------------------------------------------------------------------
"api-date":
  merge: true
  hass_component_type: sensor
  hass_entity_category: diagnostic
  hass_icon: mdi:clock-outline

"10000":
  merge: true
  hass_component_type: sensor
  hass_entity_category: diagnostic
  hass_icon: mdi:identifier

"10011":
  merge: true
  decoder: fw_master_dsp
  hass_component_type: sensor
  hass_entity_category: diagnostic
  hass_icon: mdi:chip
  hass_json_attributes: true

"10100":
  merge: true
  decoder: rtc_iso
  hass_component_type: sensor
  hass_entity_category: diagnostic
  hass_icon: mdi:calendar-clock

"33002":
  merge: true
  mqtt: bms_status
  group: now-battery
  writable: false
  decoder: enum_u16
  enum_map:
    0: "Init"
    1: "Self-check"
    2: "Normal"
    3: "Warning"
    4: "Fault"
  hass_component_type: sensor
  hass_entity_category: diagnostic
  hass_icon: mdi:battery-heart-variant
  hass_json_attributes: true
  problem_enum_values:
    - 3
    - 4

